<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Nytt schema</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F2EC; color: #1D1B18; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 44px 12px 4px; display: flex; align-items: center">
    <a href="Rela.dc.html" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; gap: 4px; text-decoration: none; color: #C2410C; font-size: 16px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Avbryt
    </a>
  </header>
  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">Nytt schema</h1>
      <p style="margin: 0; font-size: 16px; color: #5C574F">Värmefläkt – Svarven</p>
    </div>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700">Vilka dagar?</h2>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" aria-label="{{d.full}}" style="{{d.style}}">{{d.short}}</button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button onClick="{{weekdays}}" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #CFC8BC; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #1D1B18; cursor: pointer">Vardagar</button>
        <button onClick="{{everyDay}}" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #CFC8BC; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #1D1B18; cursor: pointer">Alla dagar</button>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="start" style="font-size: 18px; font-weight: 700">Slå på</label>
        <input id="start" type="time" value="06:30" style="height: 60px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #CFC8BC; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #1D1B18">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="slut" style="font-size: 18px; font-weight: 700">Stäng av</label>
        <input id="slut" type="time" value="08:00" style="height: 60px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #CFC8BC; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #1D1B18">
      </div>
    </section>

    <section style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #E3DED5">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5C574F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <p style="margin: 0; font-size: 16px; line-height: 1.45">{{summary}}</p>
    </section>
  </main>
  <div style="padding: 12px 20px 28px; border-top: 1px solid #E3DED5">
    <a href="Rela.dc.html" style="height: 54px; border-radius: 12px; background: #1D1B18; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 18px; font-weight: 700">Spara schema</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const names = [['M', 'Måndag'], ['T', 'Tisdag'], ['O', 'Onsdag'], ['T', 'Torsdag'], ['F', 'Fredag'], ['L', 'Lördag'], ['S', 'Söndag']];
    const sel = (this.state && this.state.sel) || [true, true, true, true, true, false, false];
    const chosen = names.filter((n, i) => sel[i]).map((n) => n[1].toLowerCase());
    let when = 'Inga dagar valda';
    if (chosen.length === 7) when = 'Varje dag';
    else if (sel.slice(0, 5).every(Boolean) && !sel[5] && !sel[6]) when = 'Måndag till fredag';
    else if (chosen.length) when = chosen.join(', ').replace(/^./, (c) => c.toUpperCase());
    return {
      days: names.map((n, i) => ({
        short: n[0],
        full: n[1],
        pressed: sel[i] ? 'true' : 'false',
        style: 'height: 46px; border-radius: 10px; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; padding: 0; border: 1.5px solid ' + (sel[i] ? '#C2410C' : '#CFC8BC') + '; background: ' + (sel[i] ? '#C2410C' : '#FFFFFF') + '; color: ' + (sel[i] ? '#FFFFFF' : '#1D1B18'),
        pick: () => { const c = sel.slice(); c[i] = !c[i]; this.setState({ sel: c }); }
      })),
      weekdays: () => this.setState({ sel: [true, true, true, true, true, false, false] }),
      everyDay: () => this.setState({ sel: [true, true, true, true, true, true, true] }),
      summary: when + ': reläet slås på 06:30 och stängs av 08:00.'
    };
  }
}
</script>
</body>
</html>
