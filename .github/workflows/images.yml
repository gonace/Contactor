name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One release at a time, so two runs on the same day never pick the same version.
concurrency:
  group: images
  cancel-in-progress: false

jobs:
  version:
    # Only main is published, so "latest" is always what is on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute the version
        id: version
        # YYYY.M.D in UTC, plus .N when a release was already made today (see scripts/release-version.sh).
        run: echo "version=$(bash scripts/release-version.sh)" >> "$GITHUB_OUTPUT"

  test:
    # The whole suite on the commit being released: a red test stops the release before anything is published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Contactor.slnx

      - name: Build
        run: dotnet build Contactor.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution Contactor.slnx --no-build --configuration Release --output Detailed --report-xunit-trx --report-xunit-trx-filename results.trx --results-directory TestResults

      - name: Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        # The report only shows the results; the Test step above already fails the job on a failing test.
        continue-on-error: true
        with:
          name: Release test report
          path: TestResults/*.trx
          reporter: dotnet-trx
          # The job summary, not a check run: updating its check run fails with "Not Found" (upstream issue #866).
          use-actions-summary: true

  publish:
    needs: [version, test]
    runs-on: ubuntu-latest
    # Each image's digest, for the release notes. Each leg of the matrix sets only its own output; an empty output
    # doesn't overwrite the other leg's.
    outputs:
      contactor: ${{ steps.publish.outputs.contactor }}
      contactor_demo: ${{ steps.publish.outputs.contactor_demo }}
    strategy:
      matrix:
        include:
          - image: contactor
            dockerfile: Dockerfile
            output: contactor
          - image: contactor-demo
            dockerfile: Contactor.Demo/Dockerfile
            output: contactor_demo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Check the signing key
        # Before publishing: a wrong key or password stops the release here (see scripts/images-sign.sh).
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash scripts/images-sign.sh --check

      - name: Publish image
        id: publish
        # From its Dockerfile, for linux/arm64 and linux/amd64 (scripts/images-build.sh), which prints the digest of the
        # image index it pushed, so the sign step signs exactly that, never a tag.
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          digest=$(bash scripts/images-build.sh "$image" "$VERSION" "$GITHUB_SHA" "${{ matrix.dockerfile }}")
          echo "Published $image@$digest ($VERSION)"
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.output }}=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image
        # The digest the publish step pushed: the Raspberry Pi only runs images signed with our key, and a tag moved in
        # between can't get another image signed.
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.publish.outputs.image }}
        run: bash scripts/images-sign.sh "$IMAGE"

  tag:
    # Tags the commit every image was built from, so each version maps to its exact code.
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the digests
        # Before the tag: the release notes list both images by digest, so a missing one stops the release here.
        env:
          CONTACTOR_DIGEST: ${{ needs.publish.outputs.contactor }}
          DEMO_DIGEST: ${{ needs.publish.outputs.contactor_demo }}
        run: |
          for digest in "$CONTACTOR_DIGEST" "$DEMO_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "An image's digest is missing or not a sha256 digest: '$digest'." >&2
              exit 1
            fi
          done

      - name: Create the tag
        # Through the API, not git push: GitHub refuses a pushed tag on a commit that changes .github/workflows/ unless the
        # token has the workflows permission, which GITHUB_TOKEN can't have. A tag already on this commit (a rerun) is kept;
        # one on another commit stops the release.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "The tag v$VERSION already exists on another commit ($existing)." >&2
              exit 1
            fi
            echo "The tag v$VERSION is already on this commit."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Attach the install script to the release
        # The one-command install (install/install.sh), attached to the release of this tag, with the tag filled in. It
        # is the only file attached: install.sh takes compose.yml and the update helper (contactor-updater.sh and its two
        # systemd units) from the image it installs (/app/install and /app/updater). The release is made only when it
        # isn't there yet, with notes from the titles of the pull requests merged since the release before, those
        # labelled "internal" left out (.github/release.yml); "Update now" in the app shows them, and they can be edited
        # on GitHub afterwards. A new run replaces only install.sh; the next step adds the images.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          sed "s/^RELEASE=\"\"$/RELEASE=\"v$VERSION\"/" install/install.sh > release/install.sh
          grep -qx "RELEASE=\"v$VERSION\"" release/install.sh || { echo "install.sh has no RELEASE=\"\" line to fill in." >&2; exit 1; }
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --title "$VERSION" --generate-notes
          fi
          gh release upload "v$VERSION" release/install.sh --clobber

      - name: List the images in the release notes
        # An "Images" section at the end of the notes: each image's version, digest, package page and a docker pull
        # line by digest. The release text goes above it. Run again by hand (the same script), it replaces the section
        # (from its marker to the end) and leaves the text above alone. No list items ("* " or "- "): "Update now" in the app shows those as changes.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CONTACTOR_DIGEST: ${{ needs.publish.outputs.contactor }}
          DEMO_DIGEST: ${{ needs.publish.outputs.contactor_demo }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          packages="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pkgs/container"
          marker="<!-- images -->"
          notes=$(gh release view "v$VERSION" --json body --jq .body)
          notes="${notes%%"$marker"*}"
          while [[ "$notes" == *[[:space:]] ]]; do notes="${notes%[[:space:]]}"; done
          {
            if [[ -n "$notes" ]]; then printf '%s\n\n' "$notes"; fi
            echo "$marker"
            echo "## Images"
            echo
            echo "| Image | Version | Digest |"
            echo "|---|---|---|"
            echo "| [$registry/contactor]($packages/contactor) | \`$VERSION\` | \`$CONTACTOR_DIGEST\` |"
            echo "| [$registry/contactor-demo]($packages/contactor-demo) | \`$VERSION\` | \`$DEMO_DIGEST\` |"
            echo
            echo '```sh'
            echo "docker pull $registry/contactor@$CONTACTOR_DIGEST"
            echo "docker pull $registry/contactor-demo@$DEMO_DIGEST"
            echo '```'
          } > release/notes.md
          gh release edit "v$VERSION" --notes-file release/notes.md
