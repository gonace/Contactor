name: Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One release at a time, so two runs on the same day never pick the same version.
concurrency:
  group: images
  cancel-in-progress: false

jobs:
  version:
    # Only main is published, so "latest" is always what is on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute the version
        id: version
        # YYYY.M.D in UTC, plus .N when a release was already made today (see scripts/release-version.sh).
        run: echo "version=$(bash scripts/release-version.sh)" >> "$GITHUB_OUTPUT"

  test:
    # The whole suite on the commit being released: a red test stops the release before anything is published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Contactor.slnx

      - name: Build
        run: dotnet build Contactor.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution Contactor.slnx --no-build --configuration Release --output Detailed --report-xunit-trx --report-xunit-trx-filename results.trx --results-directory TestResults

      - name: Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: Release test report
          path: TestResults/*.trx
          reporter: dotnet-trx
          use-actions-summary: false

  publish:
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: contactor
            dockerfile: Dockerfile
          - image: contactor-demo
            dockerfile: Contactor.Demo/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Check the signing key
        # Before publishing: a wrong key or password stops the release here (see scripts/images-sign.sh).
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash scripts/images-sign.sh --check

      - name: Publish image
        id: publish
        # From its Dockerfile, for linux/arm64 and linux/amd64 (scripts/images-build.sh), which prints the digest of the
        # image index it pushed, so the sign step signs exactly that, never a tag.
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          digest=$(bash scripts/images-build.sh "$image" "$VERSION" "$GITHUB_SHA" "${{ matrix.dockerfile }}")
          echo "Published $image@$digest ($VERSION)"
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image
        # The digest the publish step pushed: the Raspberry Pi only runs images signed with our key, and a tag moved in
        # between can't get another image signed.
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.publish.outputs.image }}
        run: bash scripts/images-sign.sh "$IMAGE"

  tag:
    # Tags the commit every image was built from, so each version maps to its exact code.
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push the tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: Attach the install files to the release
        # The one-command install (install/install.sh), the compose.yml it downloads and the update helper it puts in
        # place (contactor-updater.sh and its two systemd units), attached to the release of this tag. install.sh gets
        # the tag, so it downloads this release's files and they always match. The release is made only when it isn't
        # there yet, with notes from the titles of the pull requests merged since the release before, those labelled
        # "internal" left out (.github/release.yml); "Update now" in the app shows them, and they can be edited on GitHub
        # afterwards. A new run replaces only the attached files.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release
          sed "s/^RELEASE=\"\"$/RELEASE=\"v$VERSION\"/" install/install.sh > release/install.sh
          grep -qx "RELEASE=\"v$VERSION\"" release/install.sh || { echo "install.sh has no RELEASE=\"\" line to fill in." >&2; exit 1; }
          cp install/compose.yml install/contactor-updater.sh install/contactor-updater.service install/contactor-updater.path release/
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --title "$VERSION" --generate-notes
          fi
          gh release upload "v$VERSION" release/install.sh release/compose.yml release/contactor-updater.sh \
            release/contactor-updater.service release/contactor-updater.path --clobber
