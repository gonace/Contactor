# The relay app, with its Cloudflare uplink inside it. install.sh copies this file to /opt/contactor, next to the
# settings in /opt/contactor/.env (readable by root only), and upgrade.sh brings it up. No port is published on the
# Raspberry Pi: the app starts cloudflared itself (Tunnel__Token), which connects out to Cloudflare and forwards the
# app's hostname to http://contactor:8080, the container's own name on the network Compose makes for it.
name: contactor

x-logging: &logging
  # Docker keeps logs forever by default; this caps them at 30 MB per container.
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  contactor:
    image: ${CONTACTOR_IMAGE:-ghcr.io/gonace/contactor:latest}
    restart: unless-stopped
    environment:
      # Named here too, so an image from before the /data folder keeps its data with this file. Such an image has no
      # cloudflared inside, though: go back to one only with that release's deploy folder (see DEPLOY.md).
      ConnectionStrings__Default: Data Source=/data/contactor.db
      CloudflareAccess__TeamDomain: ${CF_ACCESS_TEAM_DOMAIN:?run install.sh}
      CloudflareAccess__Audience: ${CF_ACCESS_AUDIENCE:?run install.sh}
      Vm201__Host: ${VM201_HOST:?run install.sh}
      Vm201__Username: ${VM201_USERNAME:-}
      Vm201__Password: ${VM201_PASSWORD:-}
      # true logs every packet to and from the board (see DEPLOY.md); off by default.
      Vm201__LogPackets: ${VM201_LOG_PACKETS:-false}
      Tunnel__Token: ${CLOUDFLARE_TUNNEL_TOKEN:?run install.sh}
    # The database, its nightly backups and the app's keys, on the Raspberry Pi's SD card; owned by the image's user
    # (1654). The image keeps everything in /data.
    volumes:
      - /var/lib/contactor:/data
    healthcheck:
      # The same as the image's own; here too for images from before it had one. No shell or curl in the image: the
      # app asks its own /healthz.
      test: ["CMD", "dotnet", "/app/Contactor.Web.dll", "healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m
      start_interval: 5s
    logging: *logging

